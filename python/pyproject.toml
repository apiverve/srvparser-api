[project]
name = "apiverve-srvrecordparser"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "SRV Record Parser analyzes DNS SRV records and extracts service location information including priority, weight, port, and target server details."
keywords = ["srv record", "dns srv", "service record parser", "dns parser", "srv record parser"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/srvparser?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/srvparser?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/srvparser-api"
Twitter = "https://twitter.com/apivervehq"
